[workspace]
members = ["crates/domain", "crates/storage", "crates/gtk-ui"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["maglife"]
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde", "v4"] }
thiserror = "2"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
gtk4 = { version = "0.11", package = "gtk4", features = ["v4_10"] }
